name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x *.sh

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qrencode
      # No account in CI, so only the install path runs. A second run proves idempotence.
      - run: ./install.sh --no-link --no-claude --no-desktop
      - run: ./install.sh --no-link --no-claude --no-desktop
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          signal-cli --version
          signal-mcp --version | grep -F "$(. ./versions.env && echo "$SIGNAL_MCP_VERSION")"
      - run: . ./lib.sh && "$venv/bin/python" -m unittest discover -s tests -v
      - run: ./uninstall.sh
      - run: test ! -e "$HOME/.local/bin/signal-mcp"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm --no-deps signal sh -c 'signal-cli --version && signal-mcp --version'

  wsl-bootstrap:
    # The Ubuntu half of install-windows.ps1, on a stock runner, against this checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: CLAUDE_SIGNAL_REPO="$GITHUB_WORKSPACE" bash wsl-bootstrap.sh --no-link --no-claude --no-desktop
      - run: ~/.local/bin/signal-mcp --version

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install-windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          $issues = Invoke-ScriptAnalyzer -Path install-windows.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          if ($issues) { $issues | Format-Table -AutoSize; exit 1 }
